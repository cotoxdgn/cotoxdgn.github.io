<!doctype html>
<html lang="ja" class="light-only">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アーキマップ｜coto</title>
<meta name="description" content="建築士のcotoが実際に訪れた建物と、そのディテールのメモを地図にまとめています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Archivo+Narrow:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="public.css">
</head>
<body>
<div class="pm">
  <header class="pm-intro">
    <div class="kicker">Architecture Map</div>
    <h1>まちで見つけた、<br>いい建築とディテール</h1>
    <p>建築士のcotoが実際に訪れた建物を地図にまとめています。ピンか一覧をタップすると、その建物のメモに移ります。</p>
    <div class="legend" id="legend"></div>
  </header>
  <div class="pm-body">
    <div class="pm-map"><div id="map" class="map"></div></div>
    <ol class="pm-list" id="list" aria-label="建物の一覧"></ol>
  </div>
  <footer class="pm-cta" id="cta">
    <p>住まいの設計・リノベーションのご相談を受け付けています。</p>
    <div class="btns">
      <a class="primary" id="ctaWorks" href="#" target="_top" hidden>cotoの作品を見る</a>
      <a id="ctaConsult" href="#" target="_top" hidden>相談する</a>
    </div>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../common.js"></script>
<script src="public.js"></script>
</body>
</html>
