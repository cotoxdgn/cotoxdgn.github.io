<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>この端末をつなぐ</title>
<link rel="stylesheet" href="../shared/apps.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  .card { background: var(--ax-surface); border: 1px solid var(--ax-line); border-radius: var(--ax-radius); padding: 16px; margin: 12px 0; }
  .status { font-size: 18px; font-weight: 700; }
  .status.ok { color: var(--ax-ok); }
  .status.ng { color: var(--ax-danger); }
</style>
</head>
<body>
<main>
  <h1>この端末をつなぐ</h1>
  <div class="card">
    <p id="status" class="status">確認しています…</p>
    <p id="detail" class="ax-note"></p>
    <div class="ax-row">
      <a class="ax-btn ax-btn-primary" href="../">アプリ一覧へ</a>
      <button class="ax-btn" type="button" id="manage">接続を確認・変更</button>
    </div>
  </div>
  <div class="card" id="iosNote" hidden>
    <p><b>iPhone・iPad の方へ</b></p>
    <p>ここ（Safari）でつないだ設定は、ホーム画面に追加したアプリには引き継がれません。ホーム画面のアイコンから開き、「QRでつなぐ」を使ってください。</p>
  </div>
</main>
<script src="../shared/apps.js"></script>
<script>
(function () {
  // #c=… は apps.js が読み込み時に保存し、URL から消している
  function render() {
    var def = Apps.getConnection();
    var wanko = Apps.getConnection('wanko');
    var st = document.getElementById('status');
    var dt = document.getElementById('detail');
    if (def || wanko) {
      st.textContent = 'つながっています';
      st.className = 'status ok';
      var parts = [];
      if (def) parts.push('全アプリ共通：' + (def.name || 'スプレッドシート'));
      if (wanko && (!def || wanko.url !== def.url)) parts.push('wanko 専用：' + (wanko.name || 'スプレッドシート'));
      dt.textContent = parts.join(' ／ ');
    } else {
      st.textContent = 'まだつながっていません';
      st.className = 'status ng';
      dt.textContent = 'パソコンでスプシのメニュー「アプリ設定」→「この端末をつなぐ」を開いてください。';
    }
  }
  document.getElementById('manage').addEventListener('click', function () { Apps.openConnectSheet(); });
  Apps.on('connection', render);
  if (Apps.isIOS() && !Apps.isStandalone()) document.getElementById('iosNote').hidden = false;
  render();
})();
</script>
</body>
</html>
