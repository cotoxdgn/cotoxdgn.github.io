<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アプリ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>アプリ一覧</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/apps.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 22px; margin: 8px 0; }
  .conn { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--ax-line); background: var(--ax-surface); cursor: pointer; min-height: 32px; }
  .conn.ok { color: var(--ax-ok); }
  .conn.ng { color: var(--ax-danger); }
  .grid { list-style: none; padding: 0; margin: 16px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .grid a {
    display: flex; flex-direction: column; gap: 4px; height: 100%;
    padding: 16px; border-radius: var(--ax-radius); text-decoration: none; color: var(--ax-text);
    background: var(--ax-surface); border: 1px solid var(--ax-line);
  }
  .grid a:focus-visible { outline: 3px solid var(--ax-accent); outline-offset: 2px; }
  .grid .name { font-weight: 700; font-size: 17px; }
  .grid .desc { font-size: 13px; color: var(--ax-muted); }
  .grid .tag { font-size: 12px; color: var(--ax-accent); }
  .section { font-size: 14px; color: var(--ax-muted); margin: 24px 0 0; }
.soon{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>アプリ一覧</h1>
    <button type="button" class="conn" id="conn">確認中</button>
  </header>

  <p class="section">自分用</p>
  <ul class="grid" id="mine"></ul>
  <p class="section">家族用</p>
  <ul class="grid" id="family"></ul>
</main>
<script src="shared/apps.js"></script>
<script>
(function () {
  // アプリを足すときは、ここに1行追加する（path はフォルダ名）
  var APPS = [
    { path: 'routine', name: 'ルーティン', desc: '毎日の習慣を記録', group: 'mine', ready: true },
    { path: 'diary', name: '日記', desc: '出来事・感謝・今日の格言', group: 'mine', ready: true },
    { path: 'archmap', name: '建築map', desc: '見に行った・行きたい建築', group: 'mine', ready: true },
    { path: 'filemap', name: '仕事ファイルの地図', desc: 'どこに何があるか', group: 'mine' },
    { path: 'brain', name: '脳みそポートフォリオ', desc: '考えたことの置き場', group: 'mine' },
    { path: 'wanko', name: 'ワンコの歯磨き', desc: '家族で記録（別のスプシ）', group: 'family', ready: true }
  ];
  APPS.forEach(function (a) {
    var li = document.createElement('li');
    var link = document.createElement(a.ready ? 'a' : 'span');
    if (a.ready) link.href = a.path + '/'; else { link.className = 'soon'; a.desc = '準備中'; }
    link.innerHTML = '<span class="name"></span><span class="desc"></span>';
    link.querySelector('.name').textContent = a.name;
    link.querySelector('.desc').textContent = a.desc;
    li.appendChild(link);
    document.getElementById(a.group).appendChild(li);
  });

  var btn = document.getElementById('conn');
  function render() {
    var ok = Apps.isConnected();
    btn.textContent = ok ? 'つながっています' : 'この端末をつなぐ';
    btn.className = 'conn ' + (ok ? 'ok' : 'ng');
  }
  btn.addEventListener('click', function () { Apps.openConnectSheet(); });
  Apps.on('connection', render);
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
